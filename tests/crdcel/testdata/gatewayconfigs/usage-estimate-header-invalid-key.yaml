apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: usage-estimate-header-invalid-key
  namespace: default
spec:
  usageEstimates:
    - metadataKey: estimated-input-token
      cel: "input_tokens"
      byHeader: x-client-id
      emitHeader: true
