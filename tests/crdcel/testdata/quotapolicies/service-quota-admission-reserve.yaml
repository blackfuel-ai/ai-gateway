apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: service-quota-admission-reserve
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: backend
  serviceQuota:
    quota:
      limit: 100000
      duration: 1m
      admissionReserve:
        estimateByHeader: x-client-id
        percent: 90
