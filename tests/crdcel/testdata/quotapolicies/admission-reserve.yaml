apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: admission-reserve
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: backend
  perModelQuotas:
    - modelName: gpt-4
      quota:
        bucketRules:
          - clientSelectors:
              - headers:
                  - name: x-grant-id
                    type: Distinct
            quota:
              limit: 100000
              duration: 1m
              costExpression: "input_tokens > cached_input_tokens ? input_tokens - cached_input_tokens : uint(0)"
              dynamicOverride:
                fromHeader: x-bf-quota-intok-1m
              admissionReserve:
                usageEstimate: reserve_fresh_input_token
                percent: 85
          - clientSelectors:
              - headers:
                  - name: x-grant-id
                    type: Distinct
            quota:
              limit: 100000
              duration: 1m
              admissionReserve:
                usageEstimate: reserve_fresh_input_token
                percent: 100
