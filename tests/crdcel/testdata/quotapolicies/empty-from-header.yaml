apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: empty-from-header
  namespace: default
spec:
  serviceQuota:
    quota:
      limit: 100000
      duration: 1h
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: backend
  perModelQuotas:
    - modelName: gpt-4
      quota:
        defaultBucket:
          limit: 100
          duration: 1h
          dynamicOverride:
            fromHeader: ""
