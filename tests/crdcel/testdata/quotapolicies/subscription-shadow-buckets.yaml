# Three named buckets on a subscription scope. Each keys off the same
# trusted subscription selector header with a Distinct match, so every
# subscription gets its own counters, and each takes its limit from its own
# per-request override header. All three are shadow buckets: they measure the
# request against the subscription's budget and report the outcome, and they
# never reject — a caller over budget is served and classified, not throttled.
#
# The static limit is the protocol maximum on purpose: it is only reached when
# the subscription id is present but its override header is not, and a low
# fallback there would report a request as over budget on a propagation failure
# rather than on real consumption.
#
# A bucket's name and its override header are two different vocabularies and do
# not have to read alike. The names are the signal's vocabulary, chosen for what
# a recorded outcome should say; the headers follow the authorization service's
# x-bf-ratelimit-<scope>-<attrib>-<period> grammar, in which the scope segment
# is explicit ("sub" here) and the period suffix alone says what the mechanism
# needs to know. The pairing below is the contract — the global bucket counts
# requests, so it is fed by the req header and carries the Requests cost metric.
#
# The fresh-input bucket subtracts cached input rather than charging
# input_tokens: that variable maps to the provider's prompt-token count, which
# counts cached input too. Charging it as-is would bill a cache hit against the
# budget the bucket exists to keep free of them. This matches what the
# organization and key scopes already charge on their own input bucket.
#
# The ternary is not redundant. These counters are unsigned, and a runtime that
# reports more cached input than input makes the bare subtraction fail to
# evaluate. A cost expression that fails to evaluate aborts the request's whole
# dynamic-metadata struct, so the loss is not this bucket's charge: it is every
# bucket's charge plus the routing context and the served model, and the usage
# record for that request goes missing entirely. Flooring at zero keeps it.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: subscription-shadow-buckets
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: backend
  perModelQuotas:
    - modelName: kimi-k3
      quota:
        bucketRules:
          - name: subscription-global
            shadowMode: true
            clientSelectors:
              - headers:
                  - name: x-bf-subscription-id
                    type: Distinct
            quota:
              limit: 4294967295
              duration: 1m
              costMetric: Requests
              dynamicOverride:
                fromHeader: x-bf-ratelimit-sub-req-1m
          - name: subscription-fresh-input-tpm
            shadowMode: true
            clientSelectors:
              - headers:
                  - name: x-bf-subscription-id
                    type: Distinct
            quota:
              limit: 4294967295
              duration: 1m
              costExpression: "input_tokens > cached_input_tokens ? input_tokens - cached_input_tokens : uint(0)"
              dynamicOverride:
                fromHeader: x-bf-ratelimit-sub-intok-1m
          - name: subscription-output-tpm
            shadowMode: true
            clientSelectors:
              - headers:
                  - name: x-bf-subscription-id
                    type: Distinct
            quota:
              limit: 4294967295
              duration: 1m
              costExpression: output_tokens
              dynamicOverride:
                fromHeader: x-bf-ratelimit-sub-outtok-1m
