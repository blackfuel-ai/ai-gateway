# This should fail validation: there can be at most 3 additional issuers.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: additional-issuers-too-many
  namespace: default
spec:
  parentRefs:
    - name: some-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  backendRefs:
    - name: mcp-service
      kind: Service
      port: 80
  securityPolicy:
    oauth:
      issuer: https://auth.example.com
      additionalIssuers:
        - issuer: https://auth-1.example.com
        - issuer: https://auth-2.example.com
        - issuer: https://auth-3.example.com
        - issuer: https://auth-4.example.com
      protectedResourceMetadata:
        resource: https://api.example.com/mcp
