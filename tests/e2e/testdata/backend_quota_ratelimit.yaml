apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway-quota-ratelimit
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ai-gateway-quota-ratelimit
  namespace: default
  annotations:
    aigateway.envoyproxy.io/gateway-config: envoy-ai-gateway-quota-ratelimit
spec:
  gatewayClassName: envoy-ai-gateway-quota-ratelimit
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway-quota-ratelimit
---
# The fresh input tokens a request is predicted to carry, drawn from the
# x-test-client's responses of the last completed period, the estimate the
# quota-reserve-model bucket reserves. The period is the shortest allowed, so the
# admission reserve test does not wait long for a period to complete.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: envoy-ai-gateway-quota-ratelimit
  namespace: default
spec:
  usageEstimatePeriod: 5s
  usageEstimates:
    - metadataKey: reserve_fresh_input_token
      cel: "double(input_tokens) * (1.0 - cache_rate)"
      byHeader: x-test-client
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ai-gateway-quota-ratelimit
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          # Note: this is to clear the large default memory/cpu requirements for local tests.
          # In production, you should set these to values that make sense for your environment.
          resources: {}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: quota-test-model
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-quota-ratelimit
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: quota-test-model
      backendRefs:
        - name: envoy-ai-gateway-quota-ratelimit-testupstream
          modelNameOverride: quota-test-model
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: quota-dynamic-model
      backendRefs:
        - name: envoy-ai-gateway-quota-ratelimit-testupstream
          modelNameOverride: quota-dynamic-model
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: quota-org-model
      backendRefs:
        - name: envoy-ai-gateway-quota-ratelimit-testupstream
          modelNameOverride: quota-org-model
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: quota-reserve-model
      backendRefs:
        - name: envoy-ai-gateway-quota-ratelimit-testupstream
          modelNameOverride: quota-reserve-model
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: quota-release-model
      backendRefs:
        - name: envoy-ai-gateway-quota-ratelimit-testupstream
          modelNameOverride: quota-release-model
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: quota-late-reserve-model
      backendRefs:
        - name: envoy-ai-gateway-quota-ratelimit-testupstream
          modelNameOverride: quota-late-reserve-model
  # The following metadata keys are used to store the costs from the LLM request.
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-quota-ratelimit-testupstream
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: envoy-ai-gateway-quota-ratelimit-testupstream
    kind: Backend
    group: gateway.envoyproxy.io
---
# A second AIServiceBackend no route serves, targeted with the first by the
# release QuotaPolicy: the admission reserve charges both, and releases both.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-quota-ratelimit-testupstream-b
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: envoy-ai-gateway-quota-ratelimit-testupstream
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-quota-ratelimit-testupstream
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: envoy-ai-gateway-quota-ratelimit-testupstream.default.svc.cluster.local
        port: 80
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: envoy-ai-gateway-quota-ratelimit-policy
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-quota-ratelimit-testupstream
  perModelQuotas:
    - modelName: "quota-test-model"
      quota:
        mode: Shared
        defaultBucket:
          # Allow 10 total tokens per hour per backend. Once consumed,
          # subsequent requests should be rate limited (429).
          limit: 10
          duration: "1h"
    - modelName: "quota-dynamic-model"
      quota:
        mode: Shared
        defaultBucket:
          # Static fallback of 5 total tokens per hour; the x-test-quota-limit
          # header supplies a per-request limit override parsed by ext_proc.
          limit: 5
          duration: "1h"
          dynamicOverride:
            fromHeader: x-test-quota-limit
    - modelName: "quota-org-model"
      quota:
        mode: Shared
        # Per-org buckets: each distinct x-org-id gets its own 100-token/1h
        # budget. Exercised by the per-org token burndown xfail test.
        bucketRules:
          - clientSelectors:
              - headers:
                  - name: x-org-id
                    type: Distinct
            quota:
              limit: 100
              duration: "1h"
    - modelName: "quota-reserve-model"
      quota:
        mode: Shared
        defaultBucket:
          # Fresh input tokens per hour. The admission reserve charges the
          # reserve_fresh_input_token estimate of the GatewayConfig when the
          # request is admitted, and releases it when the stream ends.
          limit: 100000
          duration: "1h"
          costExpression: "input_tokens > cached_input_tokens ? input_tokens - cached_input_tokens : uint(0)"
          admissionReserve:
            usageEstimate: reserve_fresh_input_token
            percent: 100
---
# quota-release-model reserves on both targets, of which only the first serves.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: envoy-ai-gateway-quota-ratelimit-release-policy
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-quota-ratelimit-testupstream
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-quota-ratelimit-testupstream-b
  perModelQuotas:
    - modelName: "quota-release-model"
      quota:
        mode: Shared
        defaultBucket:
          limit: 100000
          duration: "1h"
          costExpression: "input_tokens > cached_input_tokens ? input_tokens - cached_input_tokens : uint(0)"
          admissionReserve:
            usageEstimate: reserve_fresh_input_token
            percent: 100
---
# quota-late-reserve-model starts without an admission reserve; the test adds one
# to the already-translated route and waits for it to reach the Envoy route config.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: envoy-ai-gateway-quota-ratelimit-late-reserve-policy
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-quota-ratelimit-testupstream
  perModelQuotas:
    - modelName: "quota-late-reserve-model"
      quota:
        mode: Shared
        defaultBucket:
          limit: 100000
          duration: "1h"
          costExpression: "input_tokens > cached_input_tokens ? input_tokens - cached_input_tokens : uint(0)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-quota-ratelimit-testupstream
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-quota-ratelimit-testupstream
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-quota-ratelimit-testupstream
    spec:
      containers:
        - name: testupstream
          image: docker.io/envoyproxy/ai-gateway-testupstream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TESTUPSTREAM_ID
              value: test
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-quota-ratelimit-testupstream
  namespace: default
spec:
  selector:
    app: envoy-ai-gateway-quota-ratelimit-testupstream
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
# Rate limit service that reads QuotaPolicy configs via xDS from the AI Gateway controller
# and enforces quota-based rate limiting for upstream clusters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-ratelimit
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-ratelimit
    spec:
      containers:
        - name: ratelimit
          command:
            - /bin/ratelimit
          # A release of the admission reserves is sent as negative hits, which
          # envoyproxy/ratelimit applies as a decrement floored at 0.
          image: docker.io/envoyproxy/ratelimit:f4e76690
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: grpc
          args:
            - --quotaRateLimitServiceAddr=envoy-ai-gateway-ratelimit.envoy-gateway-system
          env:
            - name: LOG_LEVEL
              value: debug
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: redis.redis-system.svc.cluster.local:6379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: USE_STATSD
              value: "false"
            - name: CONFIG_TYPE
              value: GRPC_XDS_SOTW
            - name: CONFIG_GRPC_XDS_NODE_ID
              value: envoy-ai-gateway-ratelimit
            - name: CONFIG_GRPC_XDS_SERVER_URL
              value: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local:18002
            - name: GRPC_PORT
              value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
spec:
  selector:
    app: envoy-ai-gateway-ratelimit
  ports:
    - name: grpc
      protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
