authorizationServerMetadata:
  directResponse:
    body:
      inline: '{"issuer":"http://auth.example.com/realms/main","authorization_endpoint":"http://auth.example.com/realms/main/auth","token_endpoint":"http://auth.example.com/realms/main/token","jwks_uri":"https://auth.example.com/realms/main/certs"}'
      type: Inline
    contentType: application/json
    header:
      set:
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Access-Control-Allow-Methods
          value: GET
        - name: Access-Control-Allow-Headers
          value: mcp-protocol-version
    statusCode: 200
backendTrafficPolicy:
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 401
      response:
        header:
          set:
            - name: WWW-Authenticate
              value:
                Bearer error="invalid_token", error_description="The access token
                is missing or invalid", resource_metadata="https://api.example.com/.well-known/oauth-protected-resource/mcp",
                scope="read write"
            - name: Access-Control-Allow-Origin
              value: "*"
            - name: Access-Control-Allow-Methods
              value: GET
            - name: Access-Control-Allow-Headers
              value: mcp-protocol-version
        statusCode: 401
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-eg-mcp-main-route
protectedResourceMetadata:
  directResponse:
    body:
      inline: '{"authorization_servers":["http://auth.example.com/realms/main"],"bearer_methods_supported":["header"],"resource":"https://api.example.com/mcp","resource_documentation":"https://api.example.com/docs","resource_name":"example","resource_policy_uri":"https://api.example.com/policy","resource_signing_alg_values_supported":["RS256"],"scopes_supported":["read","write"]}'
      type: Inline
    contentType: application/json
    header:
      set:
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Access-Control-Allow-Methods
          value: GET
        - name: Access-Control-Allow-Headers
          value: mcp-protocol-version
    statusCode: 200
requeueAfter: 0s
securityPolicy:
  apiKeyAuth:
    credentialRefs:
      - name: client-keys
    extractFrom:
      - headers:
          - x-api-key
  jwt:
    providers:
      - claimToHeaders:
          - claim: sub
            header: x-ai-eg-mcp-subject
        issuer: http://auth.example.com/realms/main
        name: mcp-jwt-provider
        remoteJWKS:
          backendRefs:
            - group: gateway.envoyproxy.io
              kind: Backend
              name: jwks-backend
          uri: https://auth.example.com/realms/main/certs
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-eg-mcp-main-route
status: "Accepted: MCP Gateway Route reconciled successfully"
