# AI-powered PR review for ai-gateway via blackfuel-ai/code-review.
#
# Prerequisites on the blackfuel-ai/code-review side (one-time, admin):
#
#   - Settings → Actions → General → Access → "Accessible from repositories
#     in the 'blackfuel-ai' organization." That setting is what lets an
#     ai-gateway workflow `uses:` a private cross-repo action via the default
#     GITHUB_TOKEN. Without it, the workflow fails to load the action.
#
# Gating: bf-pr-review acts as a hard merge gate via the PR-review system,
# not via status-check exit codes. Branch protection on `main` must be
# configured to require approving reviews + dismiss stale reviews on push, so
# a `--request-changes` review from this workflow naturally blocks merge
# until the PR is updated and re-reviewed.
#
# Future-optional: pass `approver-token: ${{ secrets.BF_REVIEWER_PAT }}` so
# the verdict review lands under a dedicated bot identity instead of the
# Actions runner. Not wired yet — wait until we have a real complaint about
# the reviewer identity.

name: bf-pr-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: bf-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # post sticky comment + push fixes if asked
      pull-requests: write # post sticky comment + submit PR review
      issues: read # read prior comments for previous-review carry-forward

    steps:
      - name: Run Claudish code review
        uses: blackfuel-ai/code-review@613c4291b9939cd0f644a0f3479c9ab4a2e8f32e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
